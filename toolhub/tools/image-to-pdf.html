  <style>
    /* Page-specific minor tweaks */
    .card{border:1px solid hsl(var(--border));background:hsl(var(--card));border-radius:var(--radius);box-shadow:0 4px 6px -1px rgb(0 0 0/0.1),0 2px 4px -2px rgb(0 0 0/0.1)}
    .drop{border:1px dashed hsl(var(--border));border-radius:var(--radius);padding:1rem;text-align:center}
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
</head>
<body class="font-body antialiased">

      <div class="container flex h-16 items-center justify-between">
  <div class="flex items-center space-x-2"><a class="flex items-center space-x-2" href="../index.html"><svg
          xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
          class="lucide lucide-wrench h-6 w-6 text-primary">
          <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"></path>
        </svg><span class="font-bold font-headline text-lg">Tool Hub</span></a></div>
        <nav class="hidden md:flex items-center space-x-2">
          <!-- PDF Tools -->
          <div class="relative group nav-group">
            <button class="inline-flex items-center justify-center gap-2 whitespace-nowrap rounded-md text-sm [&_svg]:size-4 hover:bg-accent hover:text-accent-foreground h-10 px-4 py-2 font-bold" type="button">PDF Tools
              <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-chevron-down chevron relative top-[1px] ml-1 h-3 w-3">
                <path d="m6 9 6 6 6-6"></path>

            <div class="menu-panel absolute top-full left-0 mt-2 w-64 rounded-md shadow-lg bg-background border ring-1 ring-black/5">

                <a href="./image-to-pdf.html" class="flex items-center px-4 py-2 text-sm text-foreground hover:bg-accent">Image to PDF</a>

                <a href="./merge-pdf.html" class="flex items-center px-4 py-2 text-sm text-foreground hover:bg-accent">Merge PDF</a>

                <a href="./compress-pdf.html" class="flex items-center px-4 py-2 text-sm text-foreground hover:bg-accent">Compress PDF</a>
                <a href="./scan-pdf.html" class="flex items-center px-4 py-2 text-sm text-foreground hover:bg-accent">Scan PDF</a>
              </div>
            </div>
          </div>
          <!-- Other menus can be copied as needed -->
        </nav>
        <div class="md:hidden flex items-center">
          <button class="inline-flex items-center justify-center h-10 w-10 rounded-md hover:bg-accent hover:text-accent-foreground" type="button" aria-label="Open menu">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-menu h-6 w-6"><line x1="4" x2="20" y1="12" y2="12"></line><line x1="4" x2="20" y1="6" y2="6"></line><line x1="4" x2="20" y1="18" y2="18"></line></svg>
          </button>
        </div>
      </div>

    <main class="flex-1">
      <div class="container px-4 py-8">
        <a href="/toolhub/index.html" class="btn">← Back to Home</a>
        <section class="mb-8 mt-4">
          <h1 class="text-2xl font-bold">Image to PDF</h1>
          <p class="text-muted-foreground">Convert multiple images to a single PDF. Reorder, set page, margins and fit.
          </p>
        </section>

        <section class="grid grid-cols-1 sm:grid-cols-2 gap-6">
          <div class="card p-6">
            <h2 class="text-xl font-bold mb-4">1) Select Images</h2>
            <input id="fileInput" type="file" accept="image/*" multiple class="w-full mb-4 input" />
            <div id="dropZone" class="drop">Drag & drop images here</div>
            <div class="progress mt-4" aria-label="progress"><span id="progBar"></span></div>
            <div id="status" class="text-sm text-muted-foreground mt-2"></div>
          </div>

          <div class="card p-6">
            <h2 class="text-xl font-bold mb-4">2) Options</h2>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
              <label class="text-sm">Page Size
                <select id="pageSize" class="input mt-2">
                  <option value="a4">A4</option>
                  <option value="letter">Letter</option>
                </select>
              </label>
              <label class="text-sm">Orientation
                <select id="orientation" class="input mt-2">
                  <option value="p">Portrait</option>
                  <option value="l">Landscape</option>
                </select>
              </label>
              <label class="text-sm">Margins (mm)
                <input id="margin" type="number" min="0" value="10" class="input mt-2" />
              </label>
              <label class="text-sm">Fit
                <select id="fitMode" class="input mt-2">
                  <option value="contain">Contain</option>
                  <option value="cover">Cover</option>
                  <option value="stretch">Stretch</option>
                </select>
              </label>
            </div>
            <label class="text-sm block mt-4">Output filename (without .pdf)
              <input id="outName" type="text" value="images" class="input mt-2" />
            </label>
            <button id="buildBtn" class="btn mt-6">Create PDF</button>
          </div>
        </section>

        <section class="mt-8">
          <h2 class="text-xl font-bold mb-4">Preview & Order</h2>
          <div id="preview" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4"></div>
        </section>
      </div>
    </main>

    <footer class="border-t"><div class="container px-4 py-8 text-sm text-muted-foreground">© 2025 Tool Hub. All rights reserved.</div></footer>
  </div>

  <script>
    // Transparent -> solid header on scroll
    window.addEventListener('scroll', () => {
      const header = document.querySelector('header.site-header');
      if (window.scrollY > 50) header.classList.add('scrolled'); else header.classList.remove('scrolled');
    });

    const fileInput = document.getElementById('fileInput');
    const dropZone = document.getElementById('dropZone');
    const preview = document.getElementById('preview');
    const statusEl = document.getElementById('status');
    const bar = document.getElementById('progBar');

    let images = []; // { file, url, name }

    function setProgress(ratio){ bar.style.width = Math.max(0, Math.min(1, ratio)) * 100 + '%'; }

    function addFiles(fileList){
      const arr = Array.from(fileList).filter(f => f.type.startsWith('image/'));
      if(arr.length===0){ statusEl.textContent = 'No images detected.'; return; }
      arr.forEach(f => { const url = URL.createObjectURL(f); images.push({ file: f, url, name: f.name }); });
      renderPreview();
    }

    fileInput.addEventListener('change', (e)=> addFiles(e.target.files));
    ['dragenter','dragover'].forEach(ev => dropZone.addEventListener(ev, (e)=>{ e.preventDefault(); dropZone.style.borderColor = 'hsl(var(--primary))'; }));
    ;['dragleave','drop'].forEach(ev => dropZone.addEventListener(ev, (e)=>{ e.preventDefault(); dropZone.style.borderColor = 'hsl(var(--border))'; }));
    dropZone.addEventListener('drop', (e)=> addFiles(e.dataTransfer.files));

    function renderPreview(){
      preview.innerHTML = '';
      images.forEach((img, idx)=>{
        const card = document.createElement('div');
        card.className = 'rounded-lg bg-card border p-4 shadow-sm';
        card.draggable = true; card.dataset.index = idx;
        card.innerHTML = `
          <div class="mb-2 text-sm text-muted-foreground">${idx+1}. ${img.name}</div>
          <img src="${img.url}" alt="preview" style="width:100%;height:200px;object-fit:contain;background:#111;border:1px solid hsl(var(--border));border-radius:6px;"/>
          <div class=\"mt-2 inline-flex items-center\">
            <button data-act="up" class="btn" style="height:2rem;margin-right:.5rem">Up</button>
            <button data-act="down" class="btn" style="height:2rem;margin-right:.5rem">Down</button>
            <button data-act="remove" class="btn" style="height:2rem">Remove</button>
          </div>`;

        // Drag & drop reordering
        card.addEventListener('dragstart', e=>{ e.dataTransfer.setData('text/plain', idx.toString()); card.style.opacity='0.6'; });
        card.addEventListener('dragend', ()=>{ card.style.opacity='1'; });
        card.addEventListener('dragover', e=>{ e.preventDefault(); card.style.outline='1px dashed hsl(var(--primary))'; });
        card.addEventListener('dragleave', ()=>{ card.style.outline='none'; });
        card.addEventListener('drop', e=>{
          e.preventDefault(); card.style.outline='none';
          const from = parseInt(e.dataTransfer.getData('text/plain'),10); const to = parseInt(card.dataset.index,10);
          if(!Number.isNaN(from) && !Number.isNaN(to) && from!==to){ const item = images.splice(from,1)[0]; images.splice(to,0,item); renderPreview(); }
        });

        card.querySelectorAll('button').forEach(btn=>{
          btn.addEventListener('click', ()=>{
            const act = btn.dataset.act; const i = parseInt(card.dataset.index,10);
            if(act==='up' && i>0){ [images[i-1], images[i]] = [images[i], images[i-1]]; }
            else if(act==='down' && i<images.length-1){ [images[i+1], images[i]] = [images[i], images[i+1]]; }
            else if(act==='remove'){ images.splice(i,1); }
            renderPreview();
          });
        });

        preview.appendChild(card);
      });
    }

    function pageDimensions(size, orientation){
      const sizes = { a4: [210, 297], letter: [216, 279] };
      const wh = sizes[size] || sizes.a4; return orientation==='l' ? [wh[1], wh[0]] : wh;
    }

    async function fileToDataURL(file){
      return new Promise((resolve,reject)=>{ const r = new FileReader(); r.onload=()=>resolve(r.result); r.onerror=reject; r.readAsDataURL(file); });
    }

    async function imageMeta(dataUrl){
      return new Promise((resolve,reject)=>{ const img=new Image(); img.onload=()=>{ const fmt=/^data:image\/(png|jpeg|jpg|webp)/i.exec(dataUrl)?.[1]||'jpeg'; resolve({w:img.naturalWidth,h:img.naturalHeight,format:fmt.toLowerCase()==='png'?'PNG':'JPEG'}); }; img.onerror=reject; img.src=dataUrl; });
    }

    function tick(){ return new Promise(r=> setTimeout(r,0)); }

    document.getElementById('buildBtn').addEventListener('click', async ()=>{
      try{
        if(images.length===0){ statusEl.textContent='Please add at least one image.'; return; }
        statusEl.textContent = 'Building PDF...'; setProgress(0);
        const size = document.getElementById('pageSize').value;
        const orientation = document.getElementById('orientation').value;
        const margin = Math.max(0, parseFloat(document.getElementById('margin').value)||0);
        const fit = document.getElementById('fitMode').value;
        const outName = (document.getElementById('outName').value||'images').replace(/\.pdf$/i,'');
        const { jsPDF } = window.jspdf; const [pw,ph]=pageDimensions(size,orientation);
        const doc = new jsPDF({ orientation, unit:'mm', format: size });

        for(let i=0;i<images.length;i++){
          const imgUrl = await fileToDataURL(images[i].file); const meta = await imageMeta(imgUrl);
          if(i>0) doc.addPage(size, orientation);
          const tw=pw-margin*2, th=ph-margin*2; let dw=tw, dh=th;
          if(fit==='contain'){ const s=Math.min(tw/meta.w, th/meta.h); dw=meta.w*s; dh=meta.h*s; }
          else if(fit==='cover'){ const s=Math.max(tw/meta.w, th/meta.h); dw=meta.w*s; dh=meta.h*s; }
          else { dw=tw; dh=th; }
          const dx=(pw-dw)/2, dy=(ph-dh)/2; doc.addImage(imgUrl, meta.format, dx, dy, dw, dh);
          setProgress((i+1)/images.length); statusEl.textContent = `Adding ${i+1}/${images.length}...`; await tick();
        }
        statusEl.textContent = 'Finalizing...'; doc.save(outName + '.pdf'); statusEl.textContent='Done!'; setProgress(1);
      }catch(err){ console.error(err); alert('Error building PDF: '+(err?.message||err)); statusEl.textContent='Error.'; }
    });
  </script>
</body>
</html>
