        <section class="mb-8 mt-4">
          <h1 class="text-2xl font-bold">Split PDF</h1>
          <p class="text-muted-foreground">Extract ranges into separate PDFs. Use syntax like <code>1-3,5,7-9</code>.</p>
        </section>

        <section class="grid grid-cols-1 sm:grid-cols-2 gap-6">
          <div class="card p-6">
            <h2 class="text-xl font-bold mb-4">1) Select PDF</h2>
            <input id="pdfFile" type="file" accept="application/pdf" class="input mb-4" />
            <label class="text-sm">Page ranges (e.g., 1-3, 5, 7-9)
              <input id="ranges" type="text" class="input mt-2" placeholder="1-3,5,7-9" />
            </label>
            <div class="progress mt-4"><span id="progBar"></span></div>
            <div id="status" class="text-sm text-muted-foreground mt-2"></div>
            <button id="splitBtn" class="btn mt-4">Split</button>
          </div>

          <div class="card p-6">
            <h2 class="text-xl font-bold mb-4">2) Downloads</h2>
            <button id="zipBtn" class="btn">Download All as ZIP</button>
            <div id="outList" class="mt-4 text-sm text-muted-foreground"></div>
          </div>
        </section>
      </div>
    </main>

    <footer class="border-t"><div class="container px-4 py-8 text-sm text-muted-foreground">© 2025 Tool Hub. All rights reserved.</div></footer>
  </div>

  <script>
    window.addEventListener('scroll', () => {
      const header = document.querySelector('header.site-header');
      if (window.scrollY > 50) header.classList.add('scrolled'); else header.classList.remove('scrolled');
    });

    const pdfInput = document.getElementById('pdfFile');
    const rangesEl = document.getElementById('ranges');
    const splitBtn = document.getElementById('splitBtn');
    const zipBtn = document.getElementById('zipBtn');
    const statusEl = document.getElementById('status');
    const outList = document.getElementById('outList');
    const bar = document.getElementById('progBar');

    let outputs = []; // { name, blob }
    function setProgress(r){ bar.style.width = Math.max(0,Math.min(1,r))*100+'%'; }

    function parseRanges(text, max){
      const parts = (text||'').split(/\s*,\s*/).filter(Boolean);
      const pages = new Set();
      for(const part of parts){
        const m = part.match(/^(\d+)(?:\s*-\s*(\d+))?$/);
        if(!m) continue; let a = parseInt(m[1],10), b = m[2]?parseInt(m[2],10):a;
        if(Number.isNaN(a)||Number.isNaN(b)) continue; if(a>b) [a,b]=[b,a];
        for(let i=a;i<=b;i++){ if(i>=1 && (!max || i<=max)) pages.add(i-1); } // zero-based indices
      }
      return Array.from(pages).sort((x,y)=>x-y);
    }

    async function split(){
      const file = pdfInput.files?.[0]; if(!file){ alert('Select a PDF.'); return; }
      const bytes = new Uint8Array(await file.arrayBuffer());
      const src = await PDFLib.PDFDocument.load(bytes);
      const max = src.getPageCount();
      const wanted = parseRanges(rangesEl.value, max);
      if(wanted.length===0){ alert('No valid pages.'); return; }
      outputs = []; outList.innerHTML=''; setProgress(0);

      const outBase = file.name.replace(/\.pdf$/i,'');
      let done = 0;
      for(const pageIndex of wanted){
        const dst = await PDFLib.PDFDocument.create();
        const [copied] = await dst.copyPages(src, [pageIndex]);
        dst.addPage(copied);
        const pdfBytes = await dst.save();
        const blob = new Blob([pdfBytes], { type: 'application/pdf' });
        const name = `${outBase}_p${pageIndex+1}.pdf`;
        outputs.push({ name, blob });
        const a = document.createElement('a'); a.textContent = `Download ${name}`; a.href = URL.createObjectURL(blob); a.download = name; a.className = 'btn'; a.style.display='inline-block'; a.style.marginRight='.5rem'; a.style.marginBottom='.5rem';
        outList.appendChild(a);
        done++; setProgress(done/wanted.length);
        await new Promise(r=> setTimeout(r,0));
      }
      statusEl.textContent = `Created ${outputs.length} files.`;
    }

    async function downloadZip(){
      if(outputs.length===0){ alert('No outputs to zip.'); return; }
      const zip = new JSZip();
      for(const o of outputs){ zip.file(o.name, o.blob); }
      const blob = await zip.generateAsync({ type:'blob' });
      saveAs(blob, 'split_pages.zip');
    }

    splitBtn.addEventListener('click', ()=>{ split().catch(err=>{ console.error(err); alert('Error: '+(err?.message||err)); statusEl.textContent='Error.'; }); });
    zipBtn.addEventListener('click', ()=>{ downloadZip().catch(err=>{ console.error(err); alert('Error: '+(err?.message||err)); }); });
  </script>
