        <nav class="hidden md:flex items-center space-x-2">

          <button class="inline-flex items-center justify-center h-10 w-10 rounded-md hover:bg-accent hover:text-accent-foreground" type="button" aria-label="Open menu">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-menu h-6 w-6"><line x1="4" x2="20" y1="12" y2="12"></line><line x1="4" x2="20" y1="6" y2="6"></line><line x1="4" x2="20" y1="18" y2="18"></line></svg>

    <main class="flex-1">
      <div class="container px-4 py-8">
  <a href="../index.html" class="btn">← Back to Home</a>
        <section class="mb-8 mt-4">
          <h1 class="text-2xl font-bold">Merge PDF</h1>
          <p class="text-muted-foreground">Add multiple PDFs, reorder, and merge into one document.</p>
        </section>

        <section class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div class="card p-6">
            <h2 class="text-xl font-bold mb-4">1) Select PDFs</h2>
            <input id="pdfs" type="file" accept="application/pdf" multiple class="input mb-4" />
            <div id="list" class="rounded-md border p-4 text-sm text-muted-foreground" style="min-height:120px">No files added.</div>
          </div>
          <div class="card p-6">
            <h2 class="text-xl font-bold mb-4">2) Merge</h2>
            <label class="text-sm block">Output filename (without .pdf)
              <input id="outName" type="text" value="merged" class="input mt-2" />
            </label>
            <div class="progress mt-4"><span id="progBar"></span></div>
            <div id="status" class="text-sm text-muted-foreground mt-2"></div>
            <button id="mergeBtn" class="btn mt-4">Merge PDFs</button>
          </div>
        </section>

      </div>
    </main>

    <footer class="border-t"><div class="container px-4 py-8 text-sm text-muted-foreground">© 2025 Tool Hub. All rights reserved.</div></footer>
  </div>

  <script>
    window.addEventListener('scroll', () => {
      const header = document.querySelector('header.site-header');
      if (window.scrollY > 50) header.classList.add('scrolled'); else header.classList.remove('scrolled');
    });

    const input = document.getElementById('pdfs');
    const list = document.getElementById('list');
    const mergeBtn = document.getElementById('mergeBtn');
    const statusEl = document.getElementById('status');
    const bar = document.getElementById('progBar');

    let files = []; // [{file, name}]

    function setProgress(r){ bar.style.width = Math.max(0,Math.min(1,r))*100+'%'; }

    input.addEventListener('change', (e)=>{ files = Array.from(e.target.files || []); renderList(); });

    function renderList(){
      list.innerHTML = '';
      if(files.length === 0){ list.textContent = 'No files added.'; return; }
      files.forEach((f, idx)=>{
        const row = document.createElement('div');
        row.className = 'flex items-center justify-between rounded-md border p-3 mb-2';
        row.draggable = true; row.dataset.index = idx;
        row.innerHTML = `<span>${idx+1}. ${f.name}</span>
          <span>
            <button data-act="up" class="btn" style="height:2rem;margin-right:.5rem">Up</button>
            <button data-act="down" class="btn" style="height:2rem;margin-right:.5rem">Down</button>
            <button data-act="remove" class="btn" style="height:2rem">Remove</button>
          </span>`;

        row.addEventListener('dragstart', e=>{ e.dataTransfer.setData('text/plain', idx.toString()); row.style.opacity='0.6'; });
        row.addEventListener('dragend', ()=>{ row.style.opacity='1'; });
        row.addEventListener('dragover', e=>{ e.preventDefault(); row.style.outline='1px dashed hsl(var(--primary))'; });
        row.addEventListener('dragleave', ()=>{ row.style.outline='none'; });
        row.addEventListener('drop', e=>{
          e.preventDefault(); row.style.outline='none';
          const from = parseInt(e.dataTransfer.getData('text/plain'),10); const to = parseInt(row.dataset.index,10);
          if(!Number.isNaN(from) && !Number.isNaN(to) && from!==to){ const item = files.splice(from,1)[0]; files.splice(to,0,item); renderList(); }
        });

        row.querySelectorAll('button').forEach(btn=>{
          btn.addEventListener('click', ()=>{
            const act = btn.dataset.act; const i = parseInt(row.dataset.index,10);
            if(act==='up' && i>0){ [files[i-1], files[i]] = [files[i], files[i-1]]; }
            else if(act==='down' && i<files.length-1){ [files[i+1], files[i]] = [files[i], files[i+1]]; }
            else if(act==='remove'){ files.splice(i,1); }
            renderList();
          });
        });

        list.appendChild(row);
      });
    }

    async function merge(){
      if(files.length===0){ alert('Please add at least one PDF.'); return; }
      statusEl.textContent = 'Merging...'; setProgress(0);
      const outName = (document.getElementById('outName').value || 'merged').replace(/\.pdf$/i,'');

      const mergedPdf = await PDFLib.PDFDocument.create();
      for(let i=0;i<files.length;i++){
        const bytes = new Uint8Array(await files[i].arrayBuffer());
        const srcDoc = await PDFLib.PDFDocument.load(bytes);
        const pages = await mergedPdf.copyPages(srcDoc, srcDoc.getPageIndices());
        pages.forEach(p=> mergedPdf.addPage(p));
        statusEl.textContent = `Merged ${i+1}/${files.length}...`; setProgress((i+1)/files.length);
        await new Promise(r=> setTimeout(r,0));
      }
      const mergedBytes = await mergedPdf.save();
      const blob = new Blob([mergedBytes], { type: 'application/pdf' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob); a.download = outName + '.pdf'; a.click();
      statusEl.textContent = 'Done. File downloaded.'; setProgress(1);
    }

    mergeBtn.addEventListener('click', ()=>{ merge().catch(err=>{ console.error(err); alert('Error: '+(err?.message||err)); statusEl.textContent='Error.'; }); });
  </script>
</body>
</html>
