    <main class="flex-1">
      <div class="container px-4 py-8">
  <a href="../index.html" class="btn">← Back to Home</a>
        <section class="mb-8 mt-4">
          <h1 class="text-2xl font-bold">Compress PDF</h1>
          <p class="text-muted-foreground">Rasterize pages and rebuild with lower quality to reduce file size.</p>
        </section>

        <section class="grid grid-cols-1 sm:grid-cols-2 gap-6">
          <div class="card p-6">
            <h2 class="text-xl font-bold mb-4">1) Select PDF</h2>
            <input id="pdfFile" type="file" accept="application/pdf" class="input mb-4" />
            <label class="text-sm">Quality preset
              <select id="preset" class="input mt-2">
                <option value="high">High (best quality, larger)</option>
                <option value="medium" selected>Medium</option>
                <option value="low">Low (smallest)</option>
              </select>
            </label>
            <div class="progress mt-4"><span id="progBar"></span></div>
            <div id="status" class="text-sm text-muted-foreground mt-2"></div>
            <button id="compressBtn" class="btn mt-4">Compress</button>
          </div>

          <div class="card p-6">
            <h2 class="text-xl font-bold mb-4">2) Download</h2>
            <button id="downloadBtn" class="btn" disabled>Download Compressed PDF</button>
          </div>
        </section>
      </div>
    </main>

    <footer class="border-t"><div class="container px-4 py-8 text-sm text-muted-foreground">© 2025 Tool Hub. All rights reserved.</div></footer>
  </div>

  <script>
    window.addEventListener('scroll', () => {
      const header = document.querySelector('header.site-header');
      if (window.scrollY > 50) header.classList.add('scrolled'); else header.classList.remove('scrolled');
    });

    const pdfInput = document.getElementById('pdfFile');
    const presetEl = document.getElementById('preset');
    const compressBtn = document.getElementById('compressBtn');
    const downloadBtn = document.getElementById('downloadBtn');
    const statusEl = document.getElementById('status');
    const bar = document.getElementById('progBar');

    let outBlob = null;
    function setProgress(r){ bar.style.width = Math.max(0,Math.min(1,r))*100+'%'; }

    function presetToParams(p){
      if(p==='high') return { scale:2, quality:0.9 };
      if(p==='low') return { scale:1, quality:0.6 };
      return { scale:1.5, quality:0.8 }; // medium
    }

    async function compress(){
      const file = pdfInput.files?.[0]; if(!file){ alert('Select a PDF.'); return; }
      outBlob = null; downloadBtn.disabled = true; statusEl.textContent='Loading PDF...'; setProgress(0);
      const { jsPDF } = window.jspdf;
      const arrayBuffer = await file.arrayBuffer();
      const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
      // Create doc with default A4 portrait; will auto-fit each rendered image
      const doc = new jsPDF({ unit:'pt', format:'a4', orientation:'p' });
      const params = presetToParams(presetEl.value);
      for(let p=1; p<=pdf.numPages; p++){
        statusEl.textContent = `Rendering ${p}/${pdf.numPages}...`;
        const page = await pdf.getPage(p);
        const viewport = page.getViewport({ scale: params.scale });
        const canvas = document.createElement('canvas'); const ctx = canvas.getContext('2d');
        canvas.width = viewport.width; canvas.height = viewport.height; await page.render({ canvasContext: ctx, viewport }).promise;
        const img = canvas.toDataURL('image/jpeg', params.quality);
        if(p>1) doc.addPage();
        // Fit image to page while keeping aspect (contain)
        const pageW = doc.internal.pageSize.getWidth();
        const pageH = doc.internal.pageSize.getHeight();
        const scale = Math.min(pageW/canvas.width, pageH/canvas.height);
        const w = canvas.width * scale, h = canvas.height * scale; const x=(pageW-w)/2, y=(pageH-h)/2;
        doc.addImage(img, 'JPEG', x, y, w, h);
        setProgress(p/pdf.numPages);
        await new Promise(r=> setTimeout(r,0));
      }
      statusEl.textContent='Finalizing...';
      outBlob = doc.output('blob');
      downloadBtn.disabled = false; statusEl.textContent='Ready.'; setProgress(1);
    }

    compressBtn.addEventListener('click', ()=>{ compress().catch(err=>{ console.error(err); alert('Error: '+(err?.message||err)); statusEl.textContent='Error.'; }); });
    downloadBtn.addEventListener('click', ()=>{ if(!outBlob) return; const a = document.createElement('a'); a.href=URL.createObjectURL(outBlob); a.download=(pdfFile.files?.[0]?.name||'compressed') .replace(/\.pdf$/i,'') + '_compressed.pdf'; a.click(); });
  </script>
