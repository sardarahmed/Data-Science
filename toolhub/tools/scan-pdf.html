    <main class="flex-1">
      <div class="container px-4 py-8">
  <a href="../index.html" class="btn">← Back to Home</a>
        <section class="mb-8 mt-4">
          <h1 class="text-2xl font-bold">Scan / OCR PDF</h1>
          <p class="text-muted-foreground">Turn scanned documents into searchable PDFs or extract plain text, fully in your browser.</p>
        </section>

        <section class="grid grid-cols-1 lg:grid-cols-3 gap-6">
          <div class="card p-6 lg:col-span-1">
            <h2 class="text-xl font-bold mb-4">1) Select PDF</h2>
            <input id="pdfFile" type="file" accept="application/pdf" class="input mb-4" />
            <label class="text-sm block mb-2">Language
              <select id="lang" class="input mt-1">
                <option value="eng" selected>English (eng)</option>
              </select>
            </label>
            <label class="text-sm block mb-2">DPI scale
              <select id="dpi" class="input mt-1">
                <option value="1">Standard</option>
                <option value="1.5" selected>High</option>
                <option value="2">Very High</option>
              </select>
            </label>
            <div class="progress mt-4"><span id="progBar"></span></div>
            <div id="status" class="text-sm text-muted-foreground mt-2">Idle</div>
            <button id="startBtn" class="btn mt-4">Start OCR</button>
          </div>

          <div class="card p-6 lg:col-span-2">
            <h2 class="text-xl font-bold mb-4">2) Results</h2>
            <div class="mb-3 space-x-2">
              <button id="downloadText" class="btn" disabled>Download Text (.txt)</button>
              <button id="downloadPDF" class="btn" disabled>Download Searchable PDF</button>
            </div>
            <textarea id="preview" class="input w-full min-h-[300px]" placeholder="Recognized text will appear here..." ></textarea>
          </div>
        </section>
      </div>
    </main>

    <footer class="border-t"><div class="container px-4 py-8 text-sm text-muted-foreground">© 2025 Tool Hub. All rights reserved.</div></footer>
  </div>

  <script>
    // Header scroll transparency toggle
    window.addEventListener('scroll', () => {
      const header = document.querySelector('header.site-header');
      if (window.scrollY > 50) header.classList.add('scrolled'); else header.classList.remove('scrolled');
    });

    const pdfInput = document.getElementById('pdfFile');
    const langEl = document.getElementById('lang');
    const dpiEl = document.getElementById('dpi');
    const startBtn = document.getElementById('startBtn');
    const downloadTextBtn = document.getElementById('downloadText');
    const downloadPDFBtn = document.getElementById('downloadPDF');
    const previewEl = document.getElementById('preview');
    const statusEl = document.getElementById('status');
    const bar = document.getElementById('progBar');

    let recognizedText = '';
    let searchableBlob = null;

    function setProgress(r){ bar.style.width = Math.max(0,Math.min(1,r))*100+'%'; }

    async function ocrPage(canvas, pageIndex, totalPages, worker){
      const result = await worker.recognize(canvas, langEl.value, {
        // Tesseract progress will be handled globally; per page track externally
      });
      const text = result?.data?.text || '';
      recognizedText += `\n\n----- Page ${pageIndex+1} -----\n` + text.trim();
      // Release memory
      if (result?.data) { result.data = null; }
      return text;
    }

    async function run(){
      const file = pdfInput.files?.[0]; if(!file){ alert('Select a PDF.'); return; }
      recognizedText = ''; searchableBlob = null; downloadTextBtn.disabled = true; downloadPDFBtn.disabled = true;
      setProgress(0); statusEl.textContent = 'Loading PDF...';

      const { jsPDF } = window.jspdf;
      const arrayBuffer = await file.arrayBuffer();
      const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;

      // Prepare OCR worker
      const worker = await Tesseract.createWorker({
        logger: m => {
          if (m.status && typeof m.progress === 'number') {
            statusEl.textContent = `${m.status} ${(m.progress*100).toFixed(0)}%`;
          }
        }
      });
      await worker.loadLanguage(langEl.value);
      await worker.initialize(langEl.value);

      // Prepare output PDF
      const doc = new jsPDF({ unit:'pt', format:'a4', orientation:'p' });

      // Process pages sequentially
      const scale = parseFloat(dpiEl.value) || 1.5;
      for(let p=1; p<=pdf.numPages; p++){
        statusEl.textContent = `Rendering page ${p}/${pdf.numPages}...`;
        const page = await pdf.getPage(p);
        const viewport = page.getViewport({ scale });
        const canvas = document.createElement('canvas'); const ctx = canvas.getContext('2d');
        canvas.width = viewport.width; canvas.height = viewport.height;
        await page.render({ canvasContext: ctx, viewport }).promise;

        // OCR the canvas
        statusEl.textContent = `OCR page ${p}/${pdf.numPages}...`;
        const text = await ocrPage(canvas, p-1, pdf.numPages, worker);

        // Add text then image to PDF so text is under the image (searchable but invisible)
        if(p>1) doc.addPage();
        const pageW = doc.internal.pageSize.getWidth();
        const pageH = doc.internal.pageSize.getHeight();

        // Place recognized text in a wrapped block at top-left; draw first
        try{
          doc.setTextColor(255,255,255); // white text
          const wrapped = doc.splitTextToSize(text, pageW - 40);
          doc.text(wrapped, 20, 30, { baseline: 'top' });
        } catch(e){ /* ignore */ }

        // Draw the page image to fit the page (contain)
        const img = canvas.toDataURL('image/jpeg', 0.95);
        const s = Math.min(pageW/canvas.width, pageH/canvas.height);
        const w = canvas.width * s, h = canvas.height * s; const x=(pageW-w)/2, y=(pageH-h)/2;
        doc.addImage(img, 'JPEG', x, y, w, h);

        // Update progress
        setProgress(p/pdf.numPages);
        await new Promise(r=> setTimeout(r, 0));
      }

      await worker.terminate();

      // Set outputs
      previewEl.value = recognizedText.trim();
      searchableBlob = doc.output('blob');
      downloadTextBtn.disabled = !recognizedText.trim();
      downloadPDFBtn.disabled = !searchableBlob;
      statusEl.textContent = 'Done'; setProgress(1);
    }

    startBtn.addEventListener('click', ()=>{
      run().catch(err=>{ console.error(err); alert('Error: '+(err?.message||err)); statusEl.textContent='Error.'; });
    });

    downloadTextBtn.addEventListener('click', ()=>{
      if(!recognizedText) return; const a = document.createElement('a');
      const blob = new Blob([recognizedText], { type: 'text/plain' });
      a.href = URL.createObjectURL(blob);
      a.download = (pdfFile.files?.[0]?.name||'ocr') .replace(/\.pdf$/i,'') + '.txt';
      a.click();
    });

    downloadPDFBtn.addEventListener('click', ()=>{
      if(!searchableBlob) return; const a = document.createElement('a');
      a.href = URL.createObjectURL(searchableBlob);
      a.download = (pdfFile.files?.[0]?.name||'ocr') .replace(/\.pdf$/i,'') + '_searchable.pdf';
      a.click();
    });
  </script>
