<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Download TikTok videos (no watermark) and generate beautiful, trending hashtags for your niche. Modern, vibrant, and fully responsive web tool.">
  <title>TikTok Tool: HD Video Downloader & Hashtag Generator</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #7c3aed;
      --primary-dark: #5b21b6;
      --accent: #f472b6;
      --header: #312e81;
      --bg: linear-gradient(135deg, #f9fafb 0%, #f3e8ff 100%);
      --text-main: #18181b;
      --text-secondary: #6d28d9;
      --card-bg: #fff;
      --card-border: #e0e7ff;
      --shadow: 0 4px 24px 0 rgba(124,58,237,0.08);
      --shadow-hover: 0 8px 32px 0 rgba(124,58,237,0.16);
      --radius: 1.5rem;
      --transition: 0.18s cubic-bezier(.4,0,.2,1);
    }
    html, body {
      background: var(--bg);
      color: var(--text-main);
      font-family: 'Montserrat', 'Inter', Arial, sans-serif;
      margin: 0;
      padding: 0;
      min-height: 100vh;
    }
    header {
      text-align: center;
      margin-top: 2.5rem;
      margin-bottom: 1.5rem;
    }
    .title {
      color: var(--header);
      font-size: 2.5rem;
      font-weight: 700;
      letter-spacing: -1px;
      text-shadow: 0 2px 8px #ede9fe;
    }
    .tagline {
      color: var(--primary);
      font-size: 1.15rem;
      margin-top: 0.3rem;
      font-weight: 500;
      letter-spacing: 0.01em;
    }
    .input-area {
      background: var(--card-bg);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      max-width: 700px;
      margin: 0 auto 2.5rem auto;
      padding: 2rem 1.5rem 1.5rem 1.5rem;
      display: flex;
      flex-wrap: wrap;
      gap: 1.5rem;
      align-items: flex-end;
      justify-content: center;
      transition: box-shadow var(--transition);
      border: 2px solid var(--card-border);
    }
    .input-area:focus-within {
      box-shadow: var(--shadow-hover);
      border-color: var(--primary);
    }
    .input-group {
      flex: 1 1 260px;
      min-width: 200px;
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }
    label {
      font-size: 1.08rem;
      color: var(--header);
      margin-bottom: 0.2rem;
      font-weight: 600;
      letter-spacing: 0.01em;
    }
    input[type="text"], textarea {
      border: 2px solid var(--card-border);
      border-radius: 0.9rem;
      padding: 0.8rem 1.1rem;
      font-size: 1.08rem;
      font-family: inherit;
      outline: none;
      transition: border-color var(--transition), background var(--transition);
      background: #f3e8ff;
      color: var(--text-main);
      font-weight: 500;
    }
    input[type="text"]:focus, textarea:focus {
      border-color: var(--primary);
      background: #fff;
    }
    button {
      background: linear-gradient(90deg, var(--primary), var(--accent));
      color: #fff;
      border: none;
      border-radius: 0.9rem;
      padding: 0.8rem 1.5rem;
      font-size: 1.08rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: var(--shadow);
      transition: background var(--transition), box-shadow var(--transition), transform var(--transition);
      margin-top: 1.2rem;
      letter-spacing: 0.01em;
    }
    button:hover, button:focus {
      background: linear-gradient(90deg, var(--primary-dark), var(--accent));
      box-shadow: var(--shadow-hover);
      transform: translateY(-2px) scale(1.04);
    }
    main {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 2.2rem;
      max-width: 1200px;
      margin: 0 auto 2.5rem auto;
      padding: 0 1rem;
    }
    @media (max-width: 900px) {
      main {
        grid-template-columns: 1fr;
        gap: 1.5rem;
      }
    }
    .card {
      background: var(--card-bg);
      border: 2px solid var(--card-border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 2rem 1.5rem;
      margin-bottom: 1.5rem;
      transition: box-shadow var(--transition), transform var(--transition), border-color var(--transition);
      display: flex;
      flex-direction: column;
      gap: 1.2rem;
      position: relative;
      overflow: hidden;
    }
    .card:hover {
      box-shadow: var(--shadow-hover);
      border-color: var(--primary);
      transform: translateY(-3px) scale(1.01);
    }
    .card-title {
      color: var(--primary);
      font-size: 1.35rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
      letter-spacing: 0.01em;
    }
    .result {
      font-size: 1.13rem;
      color: var(--text-main);
      word-break: break-all;
    }
    .error {
      color: #dc2626;
      background: #fef2f2;
      border-radius: 0.7rem;
      padding: 0.7rem 1rem;
      font-size: 1.08rem;
      margin-top: 0.5rem;
      font-weight: 600;
      border: 1.5px solid #fca5a5;
    }
    .video-preview {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.8rem;
    }
    .video-thumb {
      width: 100%;
      max-width: 340px;
      border-radius: 1rem;
      box-shadow: var(--shadow);
      margin-bottom: 0.5rem;
      border: 2px solid var(--accent);
    }
    .video-title {
      font-weight: 600;
      color: var(--header);
      font-size: 1.13rem;
      margin-bottom: 0.3rem;
      text-align: center;
      letter-spacing: 0.01em;
    }
    .hashtag-list {
      display: flex;
      flex-wrap: wrap;
      gap: 0.6rem;
      margin-top: 0.5rem;
      max-height: 200px;
      overflow-y: auto;
    }
    .hashtag {
      background: linear-gradient(90deg, #f3e8ff, #f9fafb 80%);
      color: var(--primary);
      border-radius: 0.7rem;
      padding: 0.38rem 1.1rem;
      font-weight: 600;
      font-size: 1.08rem;
      cursor: pointer;
      transition: background var(--transition), color var(--transition), box-shadow var(--transition);
      user-select: all;
      border: 1.5px solid var(--primary);
      box-shadow: 0 2px 8px 0 rgba(124,58,237,0.07);
      letter-spacing: 0.01em;
      display: inline-flex;
      align-items: center;
      gap: 0.2em;
    }
    .hashtag:hover {
      background: var(--primary);
      color: #fff;
      box-shadow: var(--shadow-hover);
    }
    .copy-btn {
      background: linear-gradient(90deg, #f3e8ff, #f9fafb 80%);
      color: var(--primary);
      border: 2px solid var(--primary);
      margin-top: 0.5rem;
      font-size: 1.05rem;
      font-weight: 700;
      padding: 0.6rem 1.3rem;
      border-radius: 0.7rem;
      transition: background var(--transition), color var(--transition);
      letter-spacing: 0.01em;
    }
    .copy-btn:hover {
      background: var(--primary);
      color: #fff;
    }
    .history {
      margin-top: 1.2rem;
      font-size: 1.01rem;
      color: var(--text-secondary);
    }
    .dark-mode-toggle {
      position: fixed;
      top: 1.2rem;
      right: 1.2rem;
      background: #fff;
      border: 2px solid var(--primary);
      color: var(--primary);
      border-radius: 2rem;
      padding: 0.5rem 1.3rem;
      font-size: 1.08rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: var(--shadow);
      z-index: 10;
      transition: background var(--transition), color var(--transition);
      letter-spacing: 0.01em;
    }
    .dark-mode-toggle:hover {
      background: var(--primary);
      color: #fff;
    }
    .api-tip {
      font-size: 0.98rem;
      color: #a21caf;
      margin-top: 0.5rem;
      background: #f3e8ff;
      border-radius: 0.7rem;
      padding: 0.5rem 1rem;
      border: 1.5px solid #e0e7ff;
      font-weight: 500;
    }
    @media (max-width: 700px) {
      .input-area {
        flex-direction: column;
        align-items: stretch;
        padding: 1.2rem 0.7rem;
      }
      main {
        padding: 0 0.2rem;
      }
    }
    @media (max-width: 400px) {
      .title {
        font-size: 1.4rem;
      }
      .input-area {
        padding: 0.7rem 0.2rem;
      }
    }
    body.dark {
      --bg: linear-gradient(135deg, #18181b 0%, #312e81 100%);
      --card-bg: #23232a;
      --card-border: #5b21b6;
      --text-main: #f3f4f6;
      --text-secondary: #a78bfa;
      --primary: #a78bfa;
      --primary-dark: #7c3aed;
      --header: #c7d2fe;
      --accent: #f472b6;
    }
  </style>
</head>
<body>
  <button class="dark-mode-toggle" aria-label="Toggle dark mode" id="darkModeToggle">🌙 Dark Mode</button>
  <header>
    <div class="title">TikTok Tool: Video Downloader & Hashtag Generator</div>
    <div class="tagline">Download TikTok videos (no watermark) & generate trending hashtags for your niche.</div>
  </header>
  <section class="input-area" aria-label="TikTok Tools Input Area">
    <div class="input-group" style="max-width:360px;">
      <label for="tiktokUrl">TikTok Video URL</label>
      <input type="text" id="tiktokUrl" placeholder="Paste TikTok video URL" aria-label="TikTok Video URL">
      <button id="downloadBtn">Download Video</button>
      <div class="api-tip">Powered by RapidAPI. TikTok video download uses a commercial API for best results.</div>
    </div>
    <div class="input-group" style="max-width:360px;">
      <label for="hashtagKeyword">Hashtag Keyword/Niche</label>
      <input type="text" id="hashtagKeyword" placeholder="e.g. travel, fitness, food" aria-label="Hashtag Keyword">
      <button id="generateBtn">Generate Hashtags</button>
    </div>
  </section>
  <main>
    <div class="card" id="downloaderCard" aria-live="polite">
      <div class="card-title">TikTok Video Downloader</div>
      <div id="downloaderResult" class="result"></div>
      <div id="downloadHistory" class="history"></div>
    </div>
    <div class="card" id="hashtagCard" aria-live="polite">
      <div class="card-title">Hashtag Generator</div>
      <div id="hashtagResult" class="result"></div>
      <button class="copy-btn" id="copyHashtagsBtn" style="display:none;">Copy All</button>
    </div>
  </main>
  <script>
    // --- Dark Mode Toggle ---
    const darkToggle = document.getElementById('darkModeToggle');
    darkToggle.onclick = function() {
      document.body.classList.toggle('dark');
      localStorage.setItem('tiktoktool-dark', document.body.classList.contains('dark'));
      darkToggle.textContent = document.body.classList.contains('dark') ? '☀️ Light Mode' : '🌙 Dark Mode';
    };
    if (localStorage.getItem('tiktoktool-dark') === 'true') {
      document.body.classList.add('dark');
      darkToggle.textContent = '☀️ Light Mode';
    }

    // --- TikTok Video Downloader ---
    const tiktokUrlInput = document.getElementById('tiktokUrl');
    const downloadBtn = document.getElementById('downloadBtn');
    const downloaderResult = document.getElementById('downloaderResult');
    const downloadHistoryDiv = document.getElementById('downloadHistory');
    let downloadHistory = JSON.parse(localStorage.getItem('tiktoktool-history') || '[]');

    function renderHistory() {
      if (!downloadHistory.length) {
        downloadHistoryDiv.textContent = '';
        return;
      }
      downloadHistoryDiv.innerHTML = '<b>Download History:</b><ul style="margin:0.5rem 0 0 1rem;">' +
        downloadHistory.map(h => `<li><a href="${h.url}" target="_blank" style="color:var(--primary);text-decoration:underline;">${h.title||h.url}</a></li>`).join('') + '</ul>';
    }
    renderHistory();

    function validateTikTokUrl(url) {
      return /^https?:\/\/(www\.)?tiktok\.com\/.+/.test(url.trim());
    }

    async function fetchTikTokVideo(url) {
      // Use RapidAPI TikTok video no watermark endpoint
      const rapidApiKey = 'ada781f435mshc9faf9df4bfb133p183a56jsnbc4b0e152711';
      try {
        const apiUrl = `https://tiktok-video-no-watermark2.p.rapidapi.com/?url=${encodeURIComponent(url)}&hd=1`;
        const res = await fetch(apiUrl, {
          method: 'GET',
          headers: {
            'x-rapidapi-host': 'tiktok-video-no-watermark2.p.rapidapi.com',
            'x-rapidapi-key': rapidApiKey
          }
        });
        let errorText = '';
        if (!res.ok) {
          errorText = await res.text();
          throw new Error('API error: ' + errorText);
        }
        const data = await res.json();
        let videoUrl = data.video_hd || data.video || (data.data && (data.data.video_hd || data.data.video));
        let thumb = data.cover || (data.data && data.data.cover) || 'https://www.tiktok.com/favicon.ico';
        let title = data.title || (data.data && data.data.title) || 'TikTok Video';
        let videoId = data.id || (data.data && data.data.id);
        if (!videoUrl) throw new Error('No downloadable video found.');
        // Fetch comments if videoId is available
        let comments = [];
        if (videoId) {
          try {
            const commentApi = `https://tiktok-video-no-watermark2.p.rapidapi.com/comment/reply?video_id=${videoId}&count=10&cursor=0`;
            const cres = await fetch(commentApi, {
              method: 'GET',
              headers: {
                'x-rapidapi-host': 'tiktok-video-no-watermark2.p.rapidapi.com',
                'x-rapidapi-key': rapidApiKey
              }
            });
            if (cres.ok) {
              const cdata = await cres.json();
              if (cdata.comments && Array.isArray(cdata.comments)) {
                comments = cdata.comments.map(c => ({
                  user: c.user_name || c.user?.nickname || 'User',
                  text: c.text || c.content || '',
                  avatar: c.avatar || c.user?.avatar_thumb || ''
                }));
              }
            }
          } catch (e) { /* ignore comment errors */ }
        }
        return {
          title,
          thumb,
          videoUrl,
          comments
        };
      } catch (e) {
        throw 'API error: ' + (e.message || e);
      }
    }

    downloadBtn.onclick = async function() {
      const url = tiktokUrlInput.value.trim();
      downloaderResult.innerHTML = '';
      if (!validateTikTokUrl(url)) {
        downloaderResult.innerHTML = '<div class="error">Please enter a valid TikTok video URL.</div>';
        return;
      }
      downloaderResult.innerHTML = '<div style="color:var(--primary);font-weight:600;">Fetching video...</div>';
      try {
        const data = await fetchTikTokVideo(url);
        let commentsHtml = '';
        if (data.comments && data.comments.length) {
          commentsHtml = `<div style='margin-top:1.2rem;'><b style='color:var(--primary);font-size:1.08rem;'>Top Comments</b><ul style='margin:0.5rem 0 0 0.5rem;padding:0;list-style:none;'>` +
            data.comments.map(c => `<li style='margin-bottom:0.7rem;display:flex;align-items:center;gap:0.6em;'><img src='${c.avatar||"https://www.tiktok.com/favicon.ico"}' alt='' style='width:28px;height:28px;border-radius:50%;border:1.5px solid var(--primary);object-fit:cover;vertical-align:middle;'><span style='font-weight:600;color:var(--header);'>${c.user}</span>: <span style='color:var(--text-main);'>${c.text}</span></li>`).join('') + '</ul></div>';
        }
        downloaderResult.innerHTML = `
          <div class="video-preview">
            <img src="${data.thumb}" alt="Video thumbnail" class="video-thumb">
            <div class="video-title">${data.title}</div>
            <video src="${data.videoUrl}" controls style="width:100%;max-width:340px;border-radius:1rem;"></video>
            <a href="${data.videoUrl}" download class="copy-btn" style="margin-top:0.7rem;display:inline-block;">⬇️ Download Video</a>
            ${commentsHtml}
          </div>
        `;
        // Save to history
        downloadHistory.unshift({url, title: data.title});
        if (downloadHistory.length > 10) downloadHistory = downloadHistory.slice(0,10);
        localStorage.setItem('tiktoktool-history', JSON.stringify(downloadHistory));
        renderHistory();
      } catch (e) {
        downloaderResult.innerHTML = `<div class="error">${e || 'Failed to fetch video.'}</div>`;
      }
    };

    // --- Hashtag Generator ---
    const hashtagInput = document.getElementById('hashtagKeyword');
    const generateBtn = document.getElementById('generateBtn');
    const hashtagResult = document.getElementById('hashtagResult');
    const copyBtn = document.getElementById('copyHashtagsBtn');

    // Improved Hashtag Generator
    const STOPWORDS = new Set(["the","and","for","with","you","your","are","but","not","all","can","has","have","this","that","from","was","will","they","their","our","out","get","got","just","too","very","more","most","some","any","who","how","why","what","when","where","which","about","into","over","under","again","then","than","each","other","only","own","same","so","such","no","nor","on","in","at","by","to","of","a","an","is","it","as","be","or","if","do","does","did","we","he","she","him","her","them","his","its","my","me","i"]);

    // Emoji and trending suffixes for more attractive hashtags
    const EMOJIS = ["🔥","✨","💯","🚀","🌟","🎵","🎬","💡","📈","🎉","🥇","🏆","💥","🆙","🦋","🌈","🧲","🪩"];
    const SUFFIXES = ["challenge","trend","life","tips","hacks","viral","2025","foryou","fyp","explore","moments","goals","daily","shorts","now","today","magic","edit","funny","original","music","dance","love","style","vibes","energy"];

    function capitalize(word) {
      return word.charAt(0).toUpperCase() + word.slice(1);
    }

    function generateHashtags(keyword) {
      if (!keyword) return [];
      let words = keyword.toLowerCase().replace(/[^a-z0-9 ]/g,'').split(/\s+/).filter(w => w && !STOPWORDS.has(w));
      if (!words.length) return [];
      let hashtags = new Set();
      // Single word
      words.forEach(w => {
        hashtags.add(`#${w}`);
        hashtags.add(`#${w}${EMOJIS[Math.floor(Math.random()*EMOJIS.length)]}`);
      });
      // 2-word
      for (let i=0; i<words.length-1; ++i) {
        hashtags.add(`#${words[i]}${capitalize(words[i+1])}`);
        hashtags.add(`#${words[i]}_${words[i+1]}`);
        hashtags.add(`#${words[i]}${capitalize(words[i+1])}${EMOJIS[Math.floor(Math.random()*EMOJIS.length)]}`);
      }
      // 3-word
      for (let i=0; i<words.length-2; ++i) {
        hashtags.add(`#${words[i]}${capitalize(words[i+1])}${capitalize(words[i+2])}`);
        hashtags.add(`#${words[i]}_${words[i+1]}_${words[i+2]}`);
      }
      // Add suffixes
      words.forEach(w => {
        SUFFIXES.forEach(suf => {
          hashtags.add(`#${w}${capitalize(suf)}`);
        });
      });
      // Add some popular TikTok tags
      ["tiktok","viral","foryou","fyp","trending","explore"].forEach(t => hashtags.add(`#${t}`));
      // Add a few emoji-only tags
      for (let i=0; i<3; ++i) hashtags.add(`#${EMOJIS[Math.floor(Math.random()*EMOJIS.length)]}`);
      // Sort by length, then alphabetically
      return Array.from(hashtags).sort((a,b)=>a.length-b.length || a.localeCompare(b));
    }

    function renderHashtags(hashtags) {
      if (!hashtags.length) {
        hashtagResult.innerHTML = '<span style="color:var(--text-secondary);">Enter a keyword to generate hashtags.</span>';
        copyBtn.style.display = 'none';
        return;
      }
      hashtagResult.innerHTML = '<div class="hashtag-list">' + hashtags.map(h => `<span class="hashtag" tabindex="0">${h}</span>`).join('') + '</div>';
      copyBtn.style.display = '';
    }

    function updateHashtags() {
      const kw = hashtagInput.value.trim();
      const hashtags = generateHashtags(kw);
      renderHashtags(hashtags);
    }

    hashtagInput.addEventListener('input', updateHashtags);
    generateBtn.onclick = updateHashtags;

    copyBtn.onclick = function() {
      const hashtags = Array.from(document.querySelectorAll('.hashtag')).map(h => h.textContent).join(' ');
      navigator.clipboard.writeText(hashtags).then(() => {
        copyBtn.textContent = 'Copied!';
        setTimeout(()=>copyBtn.textContent='Copy All', 1200);
      });
    };

    // Accessibility: focus on error
    tiktokUrlInput.addEventListener('keydown', function(e) {
      if (e.key === 'Enter') downloadBtn.click();
    });
    hashtagInput.addEventListener('keydown', function(e) {
      if (e.key === 'Enter') generateBtn.click();
    });
  </script>
</body>
</html>
